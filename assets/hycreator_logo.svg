<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090c15" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cubeGlowTop" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="cubeGlowFront" cx="30%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="cubeGlowRight" cx="70%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outerGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="edgeCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="edgeViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="#090c15" rx="32"/>

  <!-- Outer ambient glow -->
  <ellipse cx="128" cy="135" rx="90" ry="80" fill="url(#bgGlow)" opacity="0.8"/>

  <!-- Isometric cube - top face -->
  <!-- Top face vertices: apex top, right, bottom, left of top diamond -->
  <!-- Cube center ~128,115. Size ~80 units in isometric -->
  <!-- Top face (parallelogram) -->
  <polygon points="128,65  198,100  128,135  58,100"
           fill="url(#cubeGlowTop)" opacity="0.95"/>

  <!-- Left face (front-left) -->
  <polygon points="58,100  128,135  128,195  58,160"
           fill="url(#cubeGlowFront)" opacity="0.95"/>

  <!-- Right face (front-right) -->
  <polygon points="128,135  198,100  198,160  128,195"
           fill="url(#cubeGlowRight)" opacity="0.95"/>

  <!-- Cube edges glow overlay -->
  <!-- Top edges -->
  <line x1="128" y1="65" x2="198" y2="100" stroke="#22d3ee" stroke-width="1.5" opacity="0.9" filter="url(#softGlow)"/>
  <line x1="128" y1="65" x2="58" y2="100" stroke="#22d3ee" stroke-width="1.5" opacity="0.9" filter="url(#softGlow)"/>
  <line x1="58" y1="100" x2="128" y2="135" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>
  <line x1="198" y1="100" x2="128" y2="135" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>
  <!-- Vertical edges -->
  <line x1="58" y1="100" x2="58" y2="160" stroke="#06b6d4" stroke-width="1.5" opacity="0.85" filter="url(#softGlow)"/>
  <line x1="198" y1="100" x2="198" y2="160" stroke="#8b5cf6" stroke-width="1.5" opacity="0.85" filter="url(#softGlow)"/>
  <line x1="128" y1="135" x2="128" y2="195" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>
  <!-- Bottom edges -->
  <line x1="58" y1="160" x2="128" y2="195" stroke="#06b6d4" stroke-width="1.5" opacity="0.75"/>
  <line x1="198" y1="160" x2="128" y2="195" stroke="#8b5cf6" stroke-width="1.5" opacity="0.75"/>

  <!-- H letter on front-left face -->
  <g filter="url(#softGlow)" opacity="0.95">
    <!-- Left vertical bar of H -->
    <rect x="72" y="122" width="10" height="46"
          fill="none" stroke="#e0f7ff" stroke-width="2.5"
          transform="skewX(0) skewY(26.57)"
          rx="2"/>
    <!-- Right vertical bar of H -->
    <rect x="97" y="108" width="10" height="46"
          fill="none" stroke="#e0f7ff" stroke-width="2.5"
          transform="skewY(26.57)"
          rx="2"/>
    <!-- Crossbar of H -->
    <line x1="74" y1="150" x2="99" y2="143"
          stroke="#e0f7ff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Top face shine accent -->
  <polygon points="128,70  188,103  128,128  68,103"
           fill="white" opacity="0.06"/>

  <!-- Apex glow dot -->
  <circle cx="128" cy="65" r="4" fill="#22d3ee" filter="url(#outerGlow)" opacity="0.9"/>

  <!-- Bottom base glow line -->
  <ellipse cx="128" cy="198" rx="52" ry="6" fill="#06b6d4" opacity="0.18" filter="url(#glow)"/>

  <!-- Corner accent dots -->
  <circle cx="58" cy="100" r="2.5" fill="#22d3ee" opacity="0.8"/>
  <circle cx="198" cy="100" r="2.5" fill="#a78bfa" opacity="0.8"/>
  <circle cx="128" cy="195" r="2.5" fill="#22d3ee" opacity="0.6"/>
</svg>
